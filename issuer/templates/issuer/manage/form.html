{% extends "issuer/manage/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
        {{ field.errors }}
      </div>
      {% endfor %}
      <div class="actions">
        <button type="submit" class="btn">Save</button>
        <a class="btn btn-secondary" href="{{ cancel_url }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
