{% extends "issuer/manage/base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
  <h1>Confirm delete</h1>
  <p class="sub">Are you sure you want to delete <strong>{{ object_label }}</strong>? This cannot be undone.</p>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      <div class="actions">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a class="btn btn-secondary" href="{{ cancel_url }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
